services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /Users/simonmonk/homeassistant/config:/config
    restart: unless-stopped
    ports:
      - "8123:8123"
    networks:
      - ha_network
    depends_on:
      - influxdb

  influxdb:
    container_name: influxdb
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: homeassistant123   # change this
      DOCKER_INFLUXDB_INIT_ORG: homelab
      DOCKER_INFLUXDB_INIT_BUCKET: homeassistant
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ha-influxdb-token-changeme  # change this
    networks:
      - ha_network

volumes:
  influxdb_data:
  influxdb_config:

networks:
  ha_network:
    driver: bridge
