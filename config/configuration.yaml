
# Loads default set of integrations. Do not remove.
default_config:

# Allow Cloudflare Tunnel reverse proxy (required for agent.sol.io)
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 192.168.0.0/24
    - 192.168.68.0/24
    - 172.16.0.0/12


# Exclude chatty sensors from recorder and logbook
# Polestar timestamp sensors update every minute and flood Activity log
recorder:
  exclude:
    entities:
      - sensor.polestar_7853_estimated_fully_charged_time
      - sensor.polestar_7853_estimated_charging_time_to_target_distance
      - sensor.polestar_7853_last_updated_battery_data
      - sensor.polestar_7853_last_updated_health_data
      - sensor.polestar_7853_last_updated_odometer_data

logbook:
  exclude:
    entities:
      - sensor.polestar_7853_estimated_fully_charged_time
      - sensor.polestar_7853_estimated_charging_time_to_target_distance
      - sensor.polestar_7853_last_updated_battery_data
      - sensor.polestar_7853_last_updated_health_data
      - sensor.polestar_7853_last_updated_odometer_data

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Sonos — the Pi is dual-homed: eth0 = 192.168.0.x (default route, the energy
# segment) and wlan0 = 192.168.68.80 (the home WiFi). All 4 Sonos speakers live
# on the WiFi subnet (192.168.68.x). Auto-discovery fires SSDP multicast out the
# default interface (eth0), where there are no speakers, so HA finds nothing and
# creates an empty "hub" with no media_players. This block fixes both halves:
#   - hosts: seeds the four speaker IPs directly, bypassing multicast discovery
#   - advertise_addr: sets the UPnP event-callback IP to the wlan0 address, so
#     the speakers can reach HA back (otherwise they'd get the unreachable eth0
#     IP and every media_player would go Unavailable).
# If a speaker gets a new DHCP lease its IP here goes stale — reserve these in
# the 192.168.68.x router's DHCP table. See energy_log.md 2026-07-24.
sonos:
  media_player:
    advertise_addr: 192.168.68.80
    hosts:
      - 192.168.68.58
      - 192.168.68.66
      - 192.168.68.67
      - 192.168.68.69

input_boolean:
  ev_schedule_active:
    name: "EV — Schedule active"
    icon: mdi:car-clock
  agent_manual_override:
    # While ON the agent computes and logs its verdict but sends no commands,
    # leaving whatever reserve/mode you set in place. Auto-expires after 12h
    # (MANUAL_OVERRIDE_MAX_HOURS in energy_agent.py) so a forgotten toggle
    # can't disable the agent for days.
    # Does NOT disable: the 3-9pm demand-window reserve guard (Rule 2), or any
    # HA safety automation. Manual override can cost money; it cannot cause a
    # demand-charge breach.
    name: "Agent — Manual override"
    icon: mdi:hand-back-right

input_datetime:
  ev_departure_time:
    name: "EV — Departure time"
    has_date: true
    has_time: true

